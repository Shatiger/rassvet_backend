services:
  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: always

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./rassvet_backend
      dockerfile: Dockerfile.prod
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/1
    volumes:
      - media_volume:/app/media
      - static_volume:/app/static
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./rassvet_frontend
      dockerfile: Dockerfile
      args:
        YMAPS_API_KEY: ${YMAPS_API_KEY}
    env_file: .env
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_DOMAIN: ${NEXT_PUBLIC_DOMAIN:-http://localhost}
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/var/html/static:ro
      - media_volume:/var/html/media:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
  nginx_cache:
  redis_data: